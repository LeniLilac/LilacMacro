name: Bug report
description: Report a reproducible LilacMacro defect without private data.
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private-server links, webhook URLs, diagnostics, usernames, or local profile paths. Report security issues by email as described in SECURITY.md.
  - type: input
    id: version
    attributes:
      label: LilacMacro version
      placeholder: 1.0.140
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - Macro
        - Plan
        - Setup
        - Settings
        - Dataset Builder
        - Runtime Lab
        - Installer or updater
        - Local instances
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: List the smallest safe steps that reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and observed result
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed secrets, personal data, private links, usernames, and local profile paths.
          required: true
        - label: I am using the newest public-beta release.
          required: true
